# Dev compose — запуск: docker compose up
# Только инфра:   docker compose --profile infra up
# Только backend: docker compose --profile backend up
# Всё:            docker compose --profile full up

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    profiles: ["infra", "backend", "full"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillshare
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillshare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["infra", "backend", "full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (dev: hot-reload через uvicorn) ──────────────────────────────────
  backend:
    build:
      context: .               # build context — корень репозитория
      dockerfile: backend/Dockerfile
      target: builder          # dev использует builder-stage с uv
    profiles: ["backend", "full"]
    command:
      - sh
      - -c
      - ".venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: ./.env
    environment:
      SSN_ENVIRONMENT: docker
      SSN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/skillshare
      SSN_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot-reload
      - backend_venv:/app/.venv # сохраняем .venv из образа, не перезаписываем
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (dev: vite dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # отдельный dev-dockerfile (vite dev server)
    profiles: ["full"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
  backend_venv:
