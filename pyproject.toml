[project]
name = "skillshare-network-backend"
version = "0.1.0"
description = "SkillShare Network API (FastAPI + Postgres + Redis)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "bcrypt>=4.0",
  "pyjwt[crypto]>=2.8",
  "email-validator>=2.3.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "httpx>=0.28.1",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "backend/alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
# Пакет ``app`` лежит в backend/ — добавляем его в путь импорта для тестов.
pythonpath = ["backend"]

[tool.uv]
package = false
