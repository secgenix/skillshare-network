name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  # ── Backend: lint + format + tests ──────────────────────────────────────────
  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install deps
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check backend

      - name: Ruff format
        run: uv run ruff format --check backend

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install deps
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest backend/tests/ -v

  # ── Frontend: lint ───────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ── Docker build (проверяем что образы собираются) ───────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
